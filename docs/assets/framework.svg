<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc"><title id="title">From conditions to an observation</title><desc id="desc">Conceptual measurement proposal. Person, state, environment and interface as candidate observations. No causal model is fitted.</desc><rect width="1440" height="560" fill="#0b1115"/><text x="68" y="87" font-family="Georgia,serif" fill="#eee9df" font-size="37">The conditions of a response.</text><g font-family="Arial,sans-serif" fill="#91adb9" font-size="13" letter-spacing="3"><text x="68" y="36">A WORKING FRAME / NOT A FITTED MODEL</text><text x="68" y="521">CONCEPTUAL VARIABLES · NO PARTICIPANT DATA · NO DIAGNOSTIC SCORE</text></g><g stroke="#47616d" stroke-width="1.2" fill="none"><path d="M312 215H1094M312 285H1094M312 355H1094M312 425H1094M1094 215V425M1094 320H1150"/><path d="M1140 313l10 7-10 7"/></g><rect x="68" y="176" width="920" height="60" fill="#111b22"/><text x="89" y="218" fill="#d9c394" font-size="38" font-family="Georgia,serif">P</text><text x="162" y="202" fill="#dde8eb" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">PERSON</text><text x="162" y="223" fill="#a0b6c1" font-size="14" font-family="Arial,sans-serif">Prespecified characteristics</text><rect x="68" y="246" width="920" height="60" fill="#111b22"/><text x="89" y="288" fill="#d9c394" font-size="38" font-family="Georgia,serif">S</text><text x="162" y="272" fill="#dde8eb" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">STATE</text><text x="162" y="293" fill="#a0b6c1" font-size="14" font-family="Arial,sans-serif">Time-varying observations</text><rect x="68" y="316" width="920" height="60" fill="#111b22"/><text x="89" y="358" fill="#d9c394" font-size="38" font-family="Georgia,serif">E</text><text x="162" y="342" fill="#dde8eb" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">ENVIRONMENT</text><text x="162" y="363" fill="#a0b6c1" font-size="14" font-family="Arial,sans-serif">Defined contextual demands</text><rect x="68" y="386" width="920" height="60" fill="#111b22"/><text x="89" y="428" fill="#d9c394" font-size="38" font-family="Georgia,serif">I</text><text x="162" y="412" fill="#dde8eb" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">INTERFACE</text><text x="162" y="433" fill="#a0b6c1" font-size="14" font-family="Arial,sans-serif">How a response is requested</text><text x="1180" y="306" fill="#d9c394" font-size="75" font-family="Georgia,serif" font-style="italic">y</text><text x="1160" y="355" fill="#dde8eb" font-size="14" font-family="Arial,sans-serif">OBSERVED</text><text x="1160" y="378" fill="#dde8eb" font-size="14" font-family="Arial,sans-serif">TASK OUTCOME</text><text x="68" y="136" fill="#a0b6c1" font-size="17" font-family="Arial,sans-serif">First proposed test: does context + interface improve held-out prediction beyond a person-only baseline?</text></svg>